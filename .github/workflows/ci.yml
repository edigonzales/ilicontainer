name: Java CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build installDist
      - name: Install independent GDAL verifier
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gdal
      - name: Verify ISO-WKB with GDAL
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/verify-wkb-gdal.py
