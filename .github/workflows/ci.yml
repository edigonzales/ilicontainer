name: CI

on: [push, pull_request]

jobs:
  java:
    name: Java build and tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build installDist

  reader:
    name: Python reader (no Java, no QGIS)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test container reader
        env:
          PYTHONPATH: qgis
        run: |
          python qgis/tests/test_reader.py -v
          python -m unittest discover -s qgis/tests -p 'test_spatial_codec.py' -v

  release:
    needs: [java, reader]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build installDist releaseSources --refresh-dependencies --no-daemon
      - run: python scripts/package-qgis.py
      - name: Check extracted pure-Python package
        run: |
          mkdir -p build/plugin-check
          python -m zipfile -e build/ibx-qgis-0.6.0.zip build/plugin-check
          PYTHONPATH=build/plugin-check python -m unittest discover -s qgis/tests -p 'test_reader.py' -v
          PYTHONPATH=build/plugin-check python -m unittest discover -s qgis/tests -p 'test_spatial_codec.py' -v
          build/install/ibx/bin/ibx info demo/quartier.ibx --storage
      - run: python scripts/package-release.py
      - name: Publish format-5 preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: format5-${{ github.run_number }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd build/release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease \
            --title "IBX format 5 preview" \
            --notes "Breaking change: format 5 only; recreate format 4 files from source. Compact binary spatial pages and point leaves. CLI, pure-Python QGIS plugin, sources, checksums and dependency provenance included." \
            ./*
